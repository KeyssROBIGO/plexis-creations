<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci — Plexis Créations</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080514;color:rgba(255,255,255,.76);font-family:'Inter',system-ui,sans-serif;text-align:center;
    background-image:radial-gradient(circle at 15% 10%,rgba(90,173,255,.25),transparent 45%),radial-gradient(circle at 85% 30%,rgba(240,85,204,.22),transparent 45%),radial-gradient(circle at 50% 100%,rgba(160,96,255,.2),transparent 50%)}
  .box{max-width:480px}
  img{width:96px;height:96px;border-radius:50%;margin:0 auto 28px;display:block}
  h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(2.4rem,7vw,3.4rem);color:#fff;margin:0 0 14px;line-height:1.1}
  span{background:linear-gradient(120deg,#5AADFF,#A060FF,#F055CC);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0 0 32px;line-height:1.6}
  a{display:inline-block;padding:14px 26px;border-radius:999px;background:linear-gradient(120deg,#5AADFF,#A060FF,#F055CC);color:#0a0713;font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <img src="images/logo.png" alt="Plexis Créations">
    <h1>Merci, <span>c'est bien reçu !</span></h1>
    <p>Votre demande a été envoyée. On revient vers vous très vite. Si c'est urgent, appelez-nous au 06 09 98 09 25.</p>
    <a href="index.html">Retour au site</a>
  </div>
</body>
</html>
